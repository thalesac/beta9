  enabled: false

## Fluent Bit configuration
## ref: https://github.com/fluent/helm-charts
##
fluent-bit:
  ## @param fluent-bit.enabled Deploy Fluent Bit subchart
  ##
  enabled: false

## Minio configuration for S3-compatible storage
## ref: https://github.com/minio/minio/tree/master/helm/minio
##
minio:
  ## @param minio.enabled Deploy Minio subchart for S3-compatible storage
  ##
  enabled: true
  nameOverride: minio
  fullnameOverride: minio
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
  defaultBuckets: "beta9-fs,beta9-images,beta9-images-old,workspace"
  persistence:
    enabled: true
    size: 10Gi

## Blobcache configuration for distributed caching
## ref: https://github.com/beam-cloud/blobcache-v2/deploy/charts/blobcache/values.yaml
##
blobcache:
  ## @param blobcache.enabled Deploy Blobcache subchart
  ##
  enabled: true
  
  ## Override Redis dependency to use internal Redis (disable internal Redis, use beta9's Redis)
  redis:
    enabled: false
    
  ## Configure external Redis (use beta9's Redis instance with different database)
  externalRedis:
    host: "redis-master"
    port: 6379
    password: ""
    database: 1  # Use different database than beta9 (which uses default DB 0)
    tls: false
    
  ## Blobcache server configuration
  config:
    server:
      ## Run as coordinator mode (not slave)
      mode: "coordinator"
      token: ""
      diskCacheDir: "/blobcache-data"
      diskCacheMaxUsagePct: 0.95
      pageSizeBytes: 4000000
      maxCachePct: 60
      objectTtlS: 3600
      s3DownloadConcurrency: 16
      s3DownloadChunkSize: 64000000
      metadata:
        mode: "default"
      ## Use default sources from blobcache chart (already configured for minio)
      sources: []
      
    ## Blobcache client configuration  
    client:
      token: ""
      nTopHosts: 3
      minRetryLengthBytes: 10000000
      maxGetContentAttempts: 3
      blobfs:
        enabled: true
        directIO: false
        mountPoint: "/cache"
        maxBackgroundTasks: 256
        maxReadAheadKB: 1024
        maxWriteKB: 1024
        directMount: false
        options:
          - max_read=1048576
    global:
      defaultLocality: "default"
      coordinatorHost: "beta9-blobcache:2049"
      serverPort: 2049
      discoveryIntervalS: 5
      rttThresholdMilliseconds: 1000
      hostStorageCapacityThresholdPct: 0.95
      grpcDialTimeoutS: 1
      grpcMessageSizeBytes: 1073741824
      debugMode: false
      prettyLogs: true
      
    ## Metrics configuration
    metrics:
      pushIntervalS: 30
      url: ""
      username: ""
      password: ""
      
  ## Storage configuration
  persistence:
    enabled: true
    size: 50Gi
    
  ## Service configuration
  service:
    type: ClusterIP
    ports:
      grpc: 2049

## Cert-manager configuration for automatic TLS certificate management
## ref: https://cert-manager.io/docs/configuration/
##
certManager:
  ## @param certManager.enabled Deploy cert-manager subchart for automatic TLS certificate management
  ##
  enabled: false
  ## @param certManager.installCRDs Install cert-manager CRDs
  ##
  installCRDs: true
  ## Default cluster issuer configuration
  ## When enabled, creates a default ClusterIssuer for Let's Encrypt certificates
  ##
  clusterIssuer:
    ## @param certManager.clusterIssuer.create Create a default ClusterIssuer
    ##
    create: false
    ## @param certManager.clusterIssuer.name Name of the ClusterIssuer to create
    ##
    name: "letsencrypt-prod"
    ## @param certManager.clusterIssuer.email Email address for Let's Encrypt registration
    ##
    email: ""
    ## @param certManager.clusterIssuer.server Let's Encrypt server URL
    ##
    server: "https://acme-v02.api.letsencrypt.org/directory"
    ## @param certManager.clusterIssuer.privateKeySecretRef Secret name to store the private key
    ##
    privateKeySecretRef: "letsencrypt-prod-private-key"