## @section Beta9 Configuration

## Beta9's application configuration
## ref: https://github.com/beam-cloud/beta9/blob/main/pkg/common/config.default.yaml
##
config:
  clusterName: beta9
  debugMode: true
  prettyLogs: true
  database:
    postgres:
      host: postgresql
      port: 5432
      username: root
      password: password
      name: main
      timezone: UTC
      encryptionKey: sk_pKz38fK8v7lz01AneJI8MJnR70akmP2CtDNf1IufKcY=
    redis:
      mode: single
      addrs:
        - redis-master:6379
      password: ""
      enableTLS: false
      insecureSkipVerify: false
      dialTimeout: 3s
  storage:
    mode: juicefs
    fsName: beta9-fs
    fsPath: /data
    objectPath: /data/objects
    juicefs:
      redisURI: redis://juicefs-redis-master:6379/0
      awsS3Bucket: http://minio:9000/beta9-fs
      awsAccessKey: minioadmin
      awsSecretKey: minioadmin
      blockSize: 4096
      cacheSize: 0
      prefetch: 1
      bufferSize: 300
    workspaceStorage:
      mode: geese
      baseMountPath: /workspace/data
      defaultBucketPrefix: workspace
      defaultAccessKey: minioadmin
      defaultSecretKey: minioadmin
      defaultEndpointUrl: http://minio:9000
      defaultRegion: us-east-1
      geese:
        debug: false
        fsyncOnClose: true
        memoryLimit: 2048
        maxFlushers: 64
        maxParallelParts: 64
        dirMode: 0777
        fileMode: 0666
        listType: 1
        readAheadKB: 32768
        readAheadLargeKB: 131072
        fuseReadAheadKB: 32768
        readAheadParallelKB: 4096
        mountOptions: []
        stagedWriteModeEnabled: true
        stagedWritePath: /tmp/geesefs-staged-write
        stagedWriteDebounce: 30s
        cacheStreamingEnabled: false
  gateway:
    host: beta9-gateway
    invokeURLType: path
    grpc:
      externalHost: beta9-gateway
      externalPort: 1993
      tls: false
      port: 1993
      maxRecvMsgSize: 16
      maxSendMsgSize: 16
    http:
      externalHost: localhost
      externalPort: 1994
      tls: false
      port: 1994
      enablePrettyLogs: true
      cors:
        allowOrigins: "*"
        allowHeaders: "*"
        allowMethods: "*"
    shutdownTimeout: 180s
    stubLimits:
      cpu: 128000
      memory: 32768
      maxReplicas: 10
      maxGpuCount: 2
  fileService:
    enabled: true
    endpointUrl: http://juicefs-s3-gateway.beta9.svc.cluster.local:9900
    bucketName: beta9-fs
    accessKey: test
    secretKey: test-test-test
    region: ""
  imageService:
    localCacheEnabled: true
    archiveNanosecondsPerByte: 120
    registryStore: local
    registryCredentialProvider: docker
    buildContainerPoolSelector: build
    pythonVersion: python3.10
    registries:
      docker:
        username: ""
        password: ""
      s3:
        primary:
          bucketName: beta9-images
          region: us-east-1
          accessKey: minioadmin
          secretKey: minioadmin
          endpoint: http://minio:9000
        secondary:
          bucketName: beta9-images-old
          region: us-east-1
          accessKey: minioadmin
          secretKey: minioadmin
          endpoint: http://minio:9000
    runner:
      baseImageName: thalesac/beta9/runner
      baseImageRegistry: ghcr.io
      baseImageRepository: thalesac/beta9/runner
      baseImageTag: "0.2.0"
      baseImagePullPolicy: Always
      baseImagePullSecrets: []
      baseImageDebug: false
      baseImagePVCName: ""
      tags:
        python3.8: py38-0.2.0
        python3.9: py39-0.2.0
        python3.10: py310-0.2.0
        python3.11: py311-0.2.0
        python3.12: py312-0.2.0
        micromamba3.8: micromamba38-0.2.0
        micromamba3.9: micromamba39-0.2.0
        micromamba3.10: micromamba310-0.2.0
        micromamba3.11: micromamba311-0.2.0
        micromamba3.12: micromamba312-0.2.0
  worker:
    pools:
      default:
        mode: local
        priority: 1
        jobSpec:
          nodeSelector: {}
        criuEnabled: false
        poolSizing:
          defaultWorkerCpu: 1000m
          defaultWorkerGpuType: ""
          defaultWorkerMemory: 1Gi
          minFreeCpu: 1000m
          minFreeGpu: 0
          minFreeMemory: 1Gi
      build:
        mode: local
        requiresPoolSelector: true
        tmpSizeLimit: 50Gi
        jobSpec:
          nodeSelector: {}
        poolSizing:
          defaultWorkerCpu: 8000m
          defaultWorkerGpuType: ""
          defaultWorkerMemory: 32Gi
          minFreeCpu: 8000m
          minFreeGpu: 0
          minFreeMemory: 32Gi
          sharedMemoryLimitPct: 100%
    useHostResolvConf: true
    hostNetwork: false
    useGatewayServiceHostname: true
    imageTag: "0.2.0"
    imageName: thalesac/beta9/worker
    imageRegistry: ghcr.io
    imageRepository: thalesac/beta9/worker
    imagePullPolicy: Always
    imagePullSecrets: []
    namespace: default
    serviceAccountName: default
    tmpSizeLimit: 30Gi
    imagePVCName: ""
    jobResourcesEnforced: false
    runcResourceLimits:
      cpuEnforced: false
      memoryEnforced: false
    defaultWorkerCPURequest: 2000
    defaultWorkerMemoryRequest: 1024
    terminationGracePeriod: 30
    cleanupWorkerInterval: 1m
    cleanupPendingWorkerAgeLimit: 10m
    blobCacheEnabled: true
    containerLogLinesPerHour: 6000
    failover:
      enabled: true
      maxPendingWorkers: 10
      maxSchedulingLatencyMs: 300000
      minMachinesAvailable: 1
  monitoring:
    containerMetricsInterval: 3s
    metricsCollector: prometheus
    prometheus:
      scrapeWorkers: true
      port: 9090
    telemetry:
      enabled: false
      endpoint: ""
      meterInterval: 3s
      traceInterval: 3s
      traceSampleRatio: 1.0
    fluentbit:
      events:
        endpoint: ""
        maxConns: 0
        maxIdleConns: 30
        idleConnTimeout: 10s
        dialTimeout: 2s
        keepAlive: 30s
  ## Blobcache client configuration for workers
  blobcache:
    client:
      token: ""
      nTopHosts: 3
      minRetryLengthBytes: 10000000
      maxGetContentAttempts: 3
      blobfs:
        enabled: true
        directIO: false
        mountPoint: "/cache"
        maxBackgroundTasks: 256
        maxReadAheadKB: 1024
        maxWriteKB: 1024
        directMount: false
        options:
          - max_read=1048576
    global:
      defaultLocality: "default"
      coordinatorHost: "beta9-blobcache:2049"
      serverPort: 2049
      discoveryIntervalS: 5
      rttThresholdMilliseconds: 1000
      hostStorageCapacityThresholdPct: 0.95
      grpcDialTimeoutS: 1
      grpcMessageSizeBytes: 1073741824
      debugMode: false
      prettyLogs: true

## Diagnostic mode
## @param diagnosticMode.enabled Enable diagnostic mode (all probes will be disabled and the command will be overridden)
## @param diagnosticMode.command Command to override all containers in the chart release
## @param diagnosticMode.args Args to override all containers in the chart release
##
diagnosticMode:
  enabled: false
  command:
    - sleep
  args:
    - infinity

## @section Gateway Parameters
##

## Gateway service component for Beta9
##
gateway:
  ## Beta9 Gateway image
  ## @param gateway.image.registry Gateway image registry
  ## @param gateway.image.repository Gateway image repository  
  ## @skip gateway.image.tag Gateway image tag (immutable tags are recommended)
  ## @param gateway.image.digest Gateway image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag image tag (immutable tags are recommended)
  ## @param gateway.image.pullPolicy Gateway image pull policy
  ## @param gateway.image.pullSecrets Gateway image pull secrets
  ## @param gateway.image.debug Enable Gateway image debug mode
  ##
  image:
    registry: ghcr.io
    repository: thalesac/beta9/gateway
    tag: "0.2.0"
    digest: ""
    ## Specify a imagePullPolicy
    ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
    ##
    pullPolicy: IfNotPresent
    ## Optionally specify an array of imagePullSecrets (secrets must be manually created in the namespace)
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    ## e.g:
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##
    pullSecrets: []
    debug: false
  ## @param gateway.replicaCount Number of Gateway replicas to deploy
  ##
  replicaCount: 1
  ## @param gateway.containerPorts.grpc Gateway GRPC container port
  ## @param gateway.containerPorts.http Gateway HTTP container port
  ## @param gateway.containerPorts.metrics Gateway metrics container port
  ##
  containerPorts:
    grpc: 1993
    http: 1994
    metrics: 9090
  ## @param gateway.extraContainerPorts Optionally specify extra list of additional ports for Gateway containers
  ## e.g:
  ## extraContainerPorts:
  ##   - name: metrics
  ##     containerPort: 9090
  ##
  extraContainerPorts: []
  ## Configure extra options for Gateway containers' liveness and readiness probes
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
  ## @param gateway.livenessProbe.enabled Enable livenessProbe on Gateway containers
  ## @param gateway.livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ## @param gateway.livenessProbe.periodSeconds Period seconds for livenessProbe
  ## @param gateway.livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ## @param gateway.livenessProbe.failureThreshold Failure threshold for livenessProbe
  ## @param gateway.livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  livenessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  ## @param gateway.readinessProbe.enabled Enable readinessProbe on Gateway containers
  ## @param gateway.readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ## @param gateway.readinessProbe.periodSeconds Period seconds for readinessProbe
  ## @param gateway.readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ## @param gateway.readinessProbe.failureThreshold Failure threshold for readinessProbe
  ## @param gateway.readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
  ## @param gateway.startupProbe.enabled Enable startupProbe on Gateway containers
  ## @param gateway.startupProbe.initialDelaySeconds Initial delay seconds for startupProbe
  ## @param gateway.startupProbe.periodSeconds Period seconds for startupProbe
  ## @param gateway.startupProbe.timeoutSeconds Timeout seconds for startupProbe
  ## @param gateway.startupProbe.failureThreshold Failure threshold for startupProbe
  ## @param gateway.startupProbe.successThreshold Success threshold for startupProbe
  ##
  startupProbe:
    enabled: false
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 10
    successThreshold: 1
  ## @param gateway.customLivenessProbe Custom livenessProbe that overrides the default one
  ##
  customLivenessProbe: {}
  ## @param gateway.customReadinessProbe Custom readinessProbe that overrides the default one
  ##
  customReadinessProbe: {}
  ## @param gateway.customStartupProbe Custom startupProbe that overrides the default one
  ##
  customStartupProbe: {}
  ## Gateway resource requests and limits
  ## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
  ## @param gateway.resourcesPreset Set Gateway container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if gateway.resources is set (gateway.resources is recommended for production).
  ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
  ##
  resourcesPreset: "small"
  ## @param gateway.resources Set Gateway container requests and limits for different resources like CPU or memory (essential for production workloads)
  ## Example:
  ## resources:
  ##   requests:
  ##     cpu: 2
  ##     memory: 512Mi
  ##   limits:
  ##     cpu: 3
  ##     memory: 1024Mi
  ##
  resources: {}
  ## Configure Pods Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  ## @param gateway.podSecurityContext.enabled Enable Gateway pods' Security Context
  ## @param gateway.podSecurityContext.fsGroupChangePolicy Set filesystem group change policy for Gateway pods
  ## @param gateway.podSecurityContext.sysctls Set kernel settings using the sysctl interface for Gateway pods
  ## @param gateway.podSecurityContext.supplementalGroups Set filesystem extra groups for Gateway pods
  ## @param gateway.podSecurityContext.fsGroup Set fsGroup in Gateway pods' Security Context
  ##
  podSecurityContext:
    enabled: true
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 0
  ## Configure Container Security Context
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  ## @param gateway.containerSecurityContext.enabled Enabled Gateway container' Security Context
  ## @param gateway.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in Gateway container
  ## @param gateway.containerSecurityContext.runAsUser Set runAsUser in Gateway container' Security Context
  ## @param gateway.containerSecurityContext.runAsGroup Set runAsGroup in Gateway container' Security Context
  ## @param gateway.containerSecurityContext.runAsNonRoot Set runAsNonRoot in Gateway container' Security Context
  ## @param gateway.containerSecurityContext.readOnlyRootFilesystem Set readOnlyRootFilesystem in Gateway container' Security Context
  ## @param gateway.containerSecurityContext.privileged Set privileged in Gateway container' Security Context
  ## @param gateway.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation in Gateway container' Security Context
  ## @param gateway.containerSecurityContext.capabilities.drop List of capabilities to be dropped in Gateway container
  ## @param gateway.containerSecurityContext.seccompProfile.type Set seccomp profile in Gateway container
  ##
  containerSecurityContext:
    enabled: true
    seLinuxOptions: {}
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    privileged: true
    allowPrivilegeEscalation: true
    capabilities:
      add: ["SYS_ADMIN"]
      drop: []
    seccompProfile:
      type: "RuntimeDefault"

  ## @param gateway.existingConfigmap The name of an existing ConfigMap with your custom configuration for Gateway
  ##
  existingConfigmap: ""
  ## @param gateway.command Override default Gateway container command (useful when using custom images)
  ##
  command:
    - /usr/local/bin/gateway
  ## @param gateway.args Override default Gateway container args (useful when using custom images)
  ##
  args: []
  ## @param gateway.automountServiceAccountToken Mount Service Account token in Gateway pods
  ##
  automountServiceAccountToken: true
  ## @param gateway.hostAliases Gateway pods host aliases
  ## https://kubernetes.io/docs/concepts/services-networking/add-entries-to-pod-etc-hosts-with-host-aliases/
  ##
  hostAliases: []
  ## @param gateway.deploymentAnnotations Annotations for Gateway deployment
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  ##
  deploymentAnnotations: {}
  ## @param gateway.podLabels Extra labels for Gateway pods
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  ##
  podLabels: {}
  ## @param gateway.podAnnotations Annotations for Gateway pods
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  ##
  podAnnotations: {}
  ## @param gateway.podAffinityPreset Pod affinity preset. Ignored if `gateway.affinity` is set. Allowed values: `soft` or `hard`
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  ##
  podAffinityPreset: ""
  ## @param gateway.podAntiAffinityPreset Pod anti-affinity preset. Ignored if `gateway.affinity` is set. Allowed values: `soft` or `hard`
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
  ##
  podAntiAffinityPreset: soft
  ## Node gateway.affinity preset
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
  ##
  nodeAffinityPreset:
    ## @param gateway.nodeAffinityPreset.type Node affinity preset type. Ignored if `gateway.affinity` is set. Allowed values: `soft` or `hard`
    ##
    type: ""
    ## @param gateway.nodeAffinityPreset.key Node label key to match. Ignored if `gateway.affinity` is set
    ##
    key: ""
    ## @param gateway.nodeAffinityPreset.values Node label values to match. Ignored if `gateway.affinity` is set
    ## E.g.
    ## values:
    ##   - e2e-az1
    ##   - e2e-az2
    ##
    values: []
  ## @param gateway.affinity Affinity for Gateway pods assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  ## NOTE: `gateway.podAffinityPreset`, `gateway.podAntiAffinityPreset`, and `gateway.nodeAffinityPreset` will be ignored when it's set
  ##
  affinity: {}
  ## @param gateway.nodeSelector Node labels for Gateway pods assignment
  ## ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
  ##
  nodeSelector: {}
  ## @param gateway.tolerations Tolerations for Gateway pods assignment
  ## ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  ##
  tolerations: []
  ## @param gateway.updateStrategy.type Gateway deployment strategy type
  ## ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  ##
  updateStrategy:
    ## Can be set to RollingUpdate or Recreate
    ##
    type: RollingUpdate
  ## @param gateway.priorityClassName Gateway pods' priorityClassName
  ##
  priorityClassName: ""
  ## @param gateway.topologySpreadConstraints Topology Spread Constraints for Gateway pod assignment spread across your cluster among failure-domains
  ## Ref: https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/#spread-constraints-for-pods
  ##
  topologySpreadConstraints: []
  ## @param gateway.schedulerName Name of the k8s scheduler (other than default) for Gateway pods
  ## ref: https://kubernetes.io/docs/tasks/administer-cluster/configure-multiple-schedulers/
  ##
  schedulerName: ""
  ## @param gateway.terminationGracePeriodSeconds Seconds Gateway pods need to terminate gracefully
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
  ##
  terminationGracePeriodSeconds: ""
  ## @param gateway.lifecycleHooks for Gateway containers to automate configuration before or after startup
  ##
  lifecycleHooks: {}
  ## @param gateway.extraEnvVars Array with extra environment variables to add to Gateway containers
  ## e.g:
  ## extraEnvVars:
  ##   - name: FOO
  ##     value: "bar"
  ##
  extraEnvVars: []
  ## @param gateway.extraEnvVarsCM Name of existing ConfigMap containing extra env vars for Gateway containers
  ##
  extraEnvVarsCM: ""
  ## @param gateway.extraEnvVarsSecret Name of existing Secret containing extra env vars for Gateway containers
  ##
  extraEnvVarsSecret: ""
  ## @param gateway.extraVolumes Optionally specify extra list of additional volumes for the Gateway pods
  ##
  extraVolumes: []
  ## @param gateway.extraVolumeMounts Optionally specify extra list of additional volumeMounts for the Gateway containers
  ##
  extraVolumeMounts: []
  ## @param gateway.sidecars Add additional sidecar containers to the Gateway pods
  ## e.g:
  ## sidecars:
  ##   - name: your-image-name
  ##     image: your-image
  ##     imagePullPolicy: Always
  ##     ports:
  ##       - name: portname
  ##         containerPort: 1234
  ##
  sidecars: []
  ## @param gateway.initContainers Add additional init containers to the Gateway pods
  ## ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  ## e.g:
  ## initContainers:
  ##  - name: your-image-name
  ##    image: your-image
  ##    imagePullPolicy: Always
  ##    command: ['sh', '-c', 'echo "hello world"']
  ##
  initContainers: []
  ## Pod Disruption Budget configuration
  ## ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb
  ## @param gateway.pdb.create Enable/disable a Pod Disruption Budget creation
  ## @param gateway.pdb.minAvailable Minimum number/percentage of pods that should remain scheduled
  ## @param gateway.pdb.maxUnavailable Maximum number/percentage of pods that may be made unavailable. Defaults to `1` if both `gateway.pdb.minAvailable` and `gateway.pdb.maxUnavailable` are empty.
  ##
  pdb:
    create: false
    minAvailable: ""
    maxUnavailable: ""
  ## Autoscaling configuration
  ## ref: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  ##
  autoscaling:
    ## @param gateway.autoscaling.vpa.enabled Enable VPA for Gateway pods
    ## @param gateway.autoscaling.vpa.annotations Annotations for VPA resource
    ## @param gateway.autoscaling.vpa.controlledResources VPA List of resources that the vertical pod autoscaler can control. Defaults to cpu and memory
    ## @param gateway.autoscaling.vpa.maxAllowed VPA Max allowed resources for the pod
    ## @param gateway.autoscaling.vpa.minAllowed VPA Min allowed resources for the pod
    ##
    vpa:
      enabled: false
      annotations: {}
      controlledResources: []
      maxAllowed: {}
      minAllowed: {}
      ## @param gateway.autoscaling.vpa.updatePolicy.updateMode Autoscaling update policy
      ## Specifies whether recommended updates are applied when a Pod is started and whether recommended updates are applied during the life of a Pod
      ## Possible values are "Off", "Initial", "Recreate", and "Auto".
      ##
      updatePolicy:
        updateMode: Auto
    ## @param gateway.autoscaling.hpa.enabled Enable HPA for Gateway pods
    ## @param gateway.autoscaling.hpa.minReplicas Minimum number of replicas
    ## @param gateway.autoscaling.hpa.maxReplicas Maximum number of replicas
    ## @param gateway.autoscaling.hpa.targetCPU Target CPU utilization percentage
    ## @param gateway.autoscaling.hpa.targetMemory Target Memory utilization percentage
    ##
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: ""

## @section Worker Parameters
##

## Worker component for Beta9 (compute nodes)
##
# worker:
#   ## Beta9 Worker image
#   ## @param worker.image.registry Worker image registry
#   ## @param worker.image.repository Worker image repository  
#   ## @skip worker.image.tag Worker image tag (immutable tags are recommended)
#   ## @param worker.image.digest Worker image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag image tag (immutable tags are recommended)
#   ## @param worker.image.pullPolicy Worker image pull policy
#   ## @param worker.image.pullSecrets Worker image pull secrets
#   ## @param worker.image.debug Enable Worker image debug mode
#   ##
#   image:
#     registry: ghcr.io
#     repository: thalesac/beta9/worker
#     tag: "0.2.0"
#     digest: ""
#     pullPolicy: Always
#     pullSecrets: []
#     debug: false
#   ## @param worker.enabled Enable worker deployment
#   ##
#   enabled: true
#   ## @param worker.replicaCount Number of Worker replicas to deploy
#   ##
#   replicaCount: 1
#   ## @param worker.resources Set Worker container requests and limits for different resources like CPU or memory (essential for production workloads)
#   ##
#   resources: {}
#   ## @param worker.nodeSelector Node labels for Worker pods assignment
#   ##
#   nodeSelector: {}
#   ## @param worker.tolerations Tolerations for Worker pods assignment
#   ##
#   tolerations: []
#   ## @param worker.containerSecurityContext Container security context
#   ##
#   containerSecurityContext:
#     enabled: true
#     privileged: true
#     readOnlyRootFilesystem: false
#     runAsNonRoot: false
#   ## @param worker.podSecurityContext Pod security context
#   ##
#   podSecurityContext:
#     enabled: true
#     fsGroup: 0
#   ## @param worker.environment Worker environment variables
#   ##
#   environment:
#     ## @param worker.environment.gpuCount Number of GPUs available to worker
#     gpuCount: "0"
#     ## @param worker.environment.cpuLimit CPU limit in millicores (e.g., 1000 = 1 CPU)
#     cpuLimit: "1000"
#     ## @param worker.environment.memoryLimit Memory limit in MB
#     memoryLimit: "2048"
#     ## @param worker.environment.networkPrefix CIDR network prefix for container networking
#     networkPrefix: "172.16.0.0/16"
#     ## @param worker.environment.workerToken Authentication token for communicating with gateway
#     workerToken: "default-worker-token"

## @section Traffic Exposure Parameters
##

## Gateway service parameters
##
service:
  ## @param service.type Gateway service type
  ##
  type: ClusterIP
  ## @param service.ports.grpc Gateway service GRPC port
  ## @param service.ports.http Gateway service HTTP port
  ## @param service.ports.metrics Gateway service metrics port
  ##
  ports:
    grpc: 1993
    http: 1994
    metrics: 9090
  ## Node ports to expose
  ## @param service.nodePorts.grpc Node port for GRPC
  ## @param service.nodePorts.http Node port for HTTP
  ## NOTE: choose port between <30000-32767>
  ##
  nodePorts:
    grpc: ""
    http: ""
  ## @param service.clusterIP Gateway service Cluster IP
  ## e.g.:
  ## clusterIP: None
  ##
  clusterIP: ""
  ## @param service.loadBalancerIP Gateway service Load Balancer IP
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-loadbalancer
  ##
  loadBalancerIP: ""
  ## @param service.loadBalancerSourceRanges Gateway service Load Balancer sources
  ## ref: https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
  ## e.g:
  ## loadBalancerSourceRanges:
  ##   - 10.10.10.0/24
  ##
  loadBalancerSourceRanges: []
  ## @param service.externalTrafficPolicy Gateway service external traffic policy
  ## ref http://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
  ##
  externalTrafficPolicy: Cluster
  ## @param service.annotations Additional custom annotations for Gateway service
  ##
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
  ## @param service.extraPorts Extra ports to expose in Gateway service (normally used with the `sidecars` value)
  ##
  extraPorts: []
  ## @param service.sessionAffinity Control where client requests go, to the same pod or round-robin
  ## Values: ClientIP or None
  ## ref: https://kubernetes.io/docs/concepts/services-networking/service/
  ##
  sessionAffinity: None
  ## @param service.sessionAffinityConfig Additional settings for the sessionAffinity
  ## sessionAffinityConfig:
  ##   clientIP:
  ##     timeoutSeconds: 300
  ##
  sessionAffinityConfig: {}
## Network Policies
## Ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
##
networkPolicy:
  ## @param networkPolicy.enabled Specifies whether a NetworkPolicy should be created
  ##
  enabled: true
  ## @param networkPolicy.allowExternal Don't require server label for connections
  ## The Policy model to apply. When set to false, only pods with the correct
  ## server label will have network access to the ports server is listening
  ## on. When true, server will accept connections from any source
  ## (with the correct destination port).
  ##
  allowExternal: true
  ## @param networkPolicy.allowExternalEgress Allow the pod to access any range of port and all destinations.
  ##
  allowExternalEgress: true
  ## @param networkPolicy.addExternalClientAccess Allow access from pods with client label set to "true". Ignored if `networkPolicy.allowExternal` is true.
  ##
  addExternalClientAccess: true
  ## @param networkPolicy.extraIngress [array] Add extra ingress rules to the NetworkPolicy
  ## e.g:
  ## extraIngress:
  ##   - ports:
  ##       - port: 1234
  ##     from:
  ##       - podSelector:
  ##           - matchLabels:
  ##               - role: frontend
  ##       - podSelector:
  ##           - matchExpressions:
  ##               - key: role
  ##                 operator: In
  ##                 values:
  ##                   - frontend
  extraIngress: []
  ## @param networkPolicy.extraEgress [array] Add extra ingress rules to the NetworkPolicy (ignored if allowExternalEgress=true)
  ## e.g:
  ## extraEgress:
  ##   - ports:
  ##       - port: 1234
  ##     to:
  ##       - podSelector:
  ##           - matchLabels:
  ##               - role: frontend
  ##       - podSelector:
  ##           - matchExpressions:
  ##               - key: role
  ##                 operator: In
  ##                 values:
  ##                   - frontend
  ##
  extraEgress: []
  ## @param networkPolicy.ingressPodMatchLabels [object] Labels to match to allow traffic from other pods. Ignored if `networkPolicy.allowExternal` is true.
  ## e.g:
  ## ingressPodMatchLabels:
  ##   my-client: "true"
  #
  ingressPodMatchLabels: {}
  ## @param networkPolicy.ingressNSMatchLabels [object] Labels to match to allow traffic from other namespaces. Ignored if `networkPolicy.allowExternal` is true.
  ## @param networkPolicy.ingressNSPodMatchLabels [object] Pod labels to match to allow traffic from other namespaces. Ignored if `networkPolicy.allowExternal` is true.
  ##
  ingressNSMatchLabels: {}
  ingressNSPodMatchLabels: {}
## Beta9 Gateway ingress parameters
## ref: http://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  ## @param ingress.enabled Enable ingress record generation for Beta9 Gateway
  ##
  enabled: true
  ## @param ingress.pathType Ingress path type
  ##
  pathType: Prefix
  ## @param ingress.apiVersion Force Ingress API version (automatically detected if not set)
  ##
  apiVersion: ""
  ## @param ingress.hostname Default host for the ingress record
  ##
  hostname: api.beta9.local
  ## @param ingress.ingressClassName IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster .
  ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ##
  ingressClassName: "nginx"
  ## @param ingress.path Default path for the ingress record
  ## NOTE: You may need to set this to '/*' in order to use this with ALB ingress controllers
  ##
  path: /
  ## @param ingress.annotations Additional annotations for the Ingress resource. To enable certificate autogeneration, place here your cert-manager annotations.
  ## Use this parameter to set the required annotations for cert-manager, see
  ## ref: https://cert-manager.io/docs/usage/ingress/#supported-annotations
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##   cert-manager.io/cluster-issuer: cluster-issuer-name
  ##
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  ## @param ingress.tls Enable TLS configuration for the host defined at `ingress.hostname` parameter
  ## TLS certificates will be retrieved from a TLS secret with name: `{{- printf "%s-tls" .Values.ingress.hostname }}`
  ## You can:
  ##   - Use the `ingress.secrets` parameter to create this TLS secret
  ##   - Rely on cert-manager to create it by setting the corresponding annotations
  ##   - Rely on Helm to create self-signed certificates by setting `ingress.selfSigned=true`
  ##
  tls: false
  ## @param ingress.selfSigned Create a TLS secret for this ingress record using self-signed certificates generated by Helm
  ##
  selfSigned: false
  ## @param ingress.extraHosts An array with additional hostname(s) to be covered with the ingress record
  ## e.g:
  ## extraHosts:
  ##   - name: beta9.local
  ##     path: /
  ##
  extraHosts: []
  ## @param ingress.extraPaths An array with additional arbitrary paths that may need to be added to the ingress under the main host
  ## e.g:
  ## extraPaths:
  ## - path: /*
  ##   backend:
  ##     serviceName: ssl-redirect
  ##     servicePort: use-annotation
  ##
  extraPaths: []
  ## @param ingress.extraTls TLS configuration for additional hostname(s) to be covered with this ingress record
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  ## e.g:
  ## extraTls:
  ## - hosts:
  ##     - beta9.local
  ##   secretName: beta9.local-tls
  ##
  extraTls: []
  ## @param ingress.secrets Custom TLS certificates as secrets
  ## NOTE: 'key' and 'certificate' are expected in PEM format
  ## NOTE: 'name' should line up with a 'secretName' set further up
  ## If it is not set and you're using cert-manager, this is unneeded, as it will create a secret for you with valid certificates
  ## If it is not set and you're NOT using cert-manager either, self-signed certificates will be created valid for 365 days
  ## It is also possible to create and manage the certificates outside of this helm chart
  ## Please see README.md for more information
  ## e.g:
  ## secrets:
  ##   - name: beta9.local-tls
  ##     key: |-
  ##       -----BEGIN RSA PRIVATE KEY-----
  ##       ...
  ##       -----END RSA PRIVATE KEY-----
  ##     certificate: |-
  ##       -----BEGIN CERTIFICATE-----
  ##       ...
  ##       -----END CERTIFICATE-----
  ##
  secrets: []
  ## @param ingress.extraRules Additional rules to be covered with this ingress record
  ## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-rules
  ## e.g:
  ## extraRules:
  ## - host: example.local
  ##     http:
  ##       path: /
  ##       backend:
  ##         service:
  ##           name: example-svc
  ##           port:
  ##             name: http
  ##
  extraRules: []
  ## gRPC Ingress configuration
  ## @param ingress.grpc.enabled Enable gRPC ingress record generation for Beta9 Gateway
  ## @param ingress.grpc.hostname Default host for the gRPC ingress record  
  ## @param ingress.grpc.path Default path for the gRPC ingress record
  ## @param ingress.grpc.pathType gRPC Ingress path type
  ## @param ingress.grpc.annotations Additional annotations for the gRPC Ingress resource
  ## @param ingress.grpc.tls Enable TLS configuration for the gRPC host
  ## @param ingress.grpc.selfSigned Create a TLS secret for gRPC ingress record using self-signed certificates
  ## @param ingress.grpc.extraHosts An array with additional hostname(s) for gRPC ingress
  ## @param ingress.grpc.extraTls TLS configuration for additional gRPC hostname(s)
  ## @param ingress.grpc.extraRules Additional rules for gRPC ingress
  ##
  grpc:
    enabled: true
    hostname: grpc.beta9.local
    path: /
    pathType: Prefix
    ## TLS is REQUIRED for gRPC over nginx-ingress
    ## For cert-manager integration, add cert-manager annotations:
    ## annotations:
    ##   cert-manager.io/cluster-issuer: "letsencrypt-prod"
    ##   cert-manager.io/acme-challenge-type: http01
    ## For custom TLS behavior:
    ## annotations:
    ##   nginx.ingress.kubernetes.io/ssl-redirect: "true"
    ##   nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    annotations: {}
    ## Enable TLS for gRPC (required for gRPC over nginx-ingress)
    tls: true
    ## Create self-signed certificates if cert-manager is not available
    ## Set to false if using cert-manager or providing custom TLS secrets
    selfSigned: true
    extraHosts: []
    extraTls: []
    extraRules: []

## @section Persistence Parameters
##

## Enable persistence using Persistent Volume Claims
## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
##
persistence:
  ## @param persistence.enabled Enable persistence using Persistent Volume Claims
  ##
  enabled: true
  ## @param persistence.mountPath Path to mount the volume at.
  ##
  mountPath: /data
  ## @param persistence.subPath The subdirectory of the volume to mount to, useful in dev environments and one PV for multiple services
  ##
  subPath: ""
  ## @param persistence.storageClass Storage class of backing PVC
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ##   set, choosing the default provisioner.  (gp2 on AWS, standard on
  ##   GKE, AWS & OpenStack)
  ##
  storageClass: ""
  ## @param persistence.annotations Persistent Volume Claim annotations
  ##
  annotations: {}
  ## @param persistence.accessModes Persistent Volume Access Modes
  ##
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size Size of data volume
  ##
  size: 50Gi
  ## @param persistence.dataSource Custom PVC data source
  ##
  dataSource: {}
  ## @param persistence.existingClaim The name of an existing PVC to use for persistence
  ##
  existingClaim: ""
  ## @param persistence.selector Selector to match an existing Persistent Volume for Beta9 data PVC
  ## If set, the PVC can't have a PV dynamically provisioned for it
  ## E.g.
  ## selector:
  ##   matchLabels:
  ##     app: my-app
  ##
  selector: {}

## @section Default init containers Parameters

defaultInitContainers:
  ## 'volume-permissions' init container
  ## Changes the owner and group of the persistent volume mount(s) point(s) to runAsUser:fsGroup values
  ##   based on the *podSecurityContext/*containerSecurityContext parameters
  ##
  volumePermissions:
    ## @param defaultInitContainers.volumePermissions.enabled Enable init container that adapts the owner/group of the PV mount(s) point(s)
    ##
    enabled: false
    ## OS Shell + Utility image
    ## ref: https://hub.docker.com/r/bitnami/os-shell
    ## @param defaultInitContainers.volumePermissions.image.registry [default: REGISTRY_NAME] "volume-permissions" init-containers' image registry
    ## @param defaultInitContainers.volumePermissions.image.repository [default: REPOSITORY_NAME/os-shell] "volume-permissions" init-containers' image repository
    ## @skip defaultInitContainers.volumePermissions.image.tag "volume-permissions" init-containers' image tag (immutable tags are recommended)
    ## @param defaultInitContainers.volumePermissions.image.digest "volume-permissions" init-containers' image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
    ## @param defaultInitContainers.volumePermissions.image.pullPolicy "volume-permissions" init-containers' image pull policy
    ## @param defaultInitContainers.volumePermissions.image.pullSecrets "volume-permissions" init-containers' image pull secrets
    ##
    image:
      registry: docker.io
      repository: bitnami/os-shell
      tag: 12-debian-12-r46
      digest: ""
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##
      pullSecrets: []
  ## 'wait-on-backends' init container  
  ## Waits for backend services (PostgreSQL, Redis, Minio) to be ready before starting main containers
  ##
  waitOnBackends:
    ## Busybox image used for service readiness checks
    ## @param defaultInitContainers.waitOnBackends.image.registry Wait-on-backends init-container image registry
    ## @param defaultInitContainers.waitOnBackends.image.repository Wait-on-backends init-container image repository
    ## @param defaultInitContainers.waitOnBackends.image.tag Wait-on-backends init-container image tag (immutable tags are recommended)
    ## @param defaultInitContainers.waitOnBackends.image.digest Wait-on-backends init-container image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
    ## @param defaultInitContainers.waitOnBackends.image.pullPolicy Wait-on-backends init-container image pull policy
    ## @param defaultInitContainers.waitOnBackends.image.pullSecrets Wait-on-backends init-container image pull secrets
    ##
    image:
      registry: docker.io
      repository: busybox
      tag: 1.37.0
      digest: ""
      pullPolicy: IfNotPresent
      ## Optionally specify an array of imagePullSecrets.
      ## Secrets must be manually created in the namespace.
      ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
      ## Example:
      ## pullSecrets:
      ##   - myRegistryKeySecretName
      ##
      pullSecrets: []
    ## Configure "volume-permissions" init-container Security Context
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.enabled Enabled "volume-permissions" init-containers' Security Context
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in "volume-permissions" init-containers
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.runAsUser Set runAsUser in "volume-permissions" init-containers' Security Context
    ## NOTE: when runAsUser is set to special value "auto", init container will try to chown the
    ##   data folder to auto-determined user&group, using commands: `id -u`:`id -G | cut -d" " -f2`
    ##   "auto" is especially useful for OpenShift which has scc with dynamic user ids (and 0 is not allowed)
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.privileged Set privileged in "volume-permissions" init-containers' Security Context
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.allowPrivilegeEscalation Set allowPrivilegeEscalation in "volume-permissions" init-containers' Security Context
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.capabilities.add List of capabilities to be added in "volume-permissions" init-containers
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.capabilities.drop List of capabilities to be dropped in "volume-permissions" init-containers
    ## @param defaultInitContainers.volumePermissions.containerSecurityContext.seccompProfile.type Set seccomp profile in "volume-permissions" init-containers
    ##
    containerSecurityContext:
      enabled: true
      seLinuxOptions: {}
      runAsUser: 0
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        add: []
        drop: ["ALL"]
      seccompProfile:
        type: "RuntimeDefault"
    ## "volume-permissions" init container resource requests and limits
    ## ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
    ## @param defaultInitContainers.volumePermissions.resourcesPreset Set "volume-permissions" init container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge). This is ignored if defaultInitContainers.volumePermissions.resources is set (defaultInitContainers.volumePermissions.resources is recommended for production).
    ## More information: https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L15
    ##
    resourcesPreset: "nano"
    ## @param defaultInitContainers.volumePermissions.resources Set "volume-permissions" init container requests and limits for different resources like CPU or memory (essential for production workloads)
    ## E.g:
    ## resources:
    ##   requests:
    ##     cpu: 2
    ##     memory: 512Mi
    ##   limits:
    ##     cpu: 3
    ##     memory: 1024Mi
    ##
    resources: {}

